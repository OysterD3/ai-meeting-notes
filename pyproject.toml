[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-meeting-notes"
version = "0.1.0"
description = "Local MLX transcription, meeting notes, and an infographic through your existing Pi or Claude Code sign-in."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "mlx-whisper>=0.4.3,<0.5",
  "imageio-ffmpeg>=0.6,<0.7",
  "numpy>=2,<3",
]

[project.urls]
Repository = "https://github.com/OysterD3/ai-meeting-notes"
Issues = "https://github.com/OysterD3/ai-meeting-notes/issues"

[project.scripts]
meeting-notes = "meeting_notes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["meeting_notes"]
